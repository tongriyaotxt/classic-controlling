[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "classic-controlling"
version = "0.2.0"
description = "Self-tuning ADRC, industrial PID (cascade/feedforward/derivative-on-measurement), vectorized UKF, and dependency-free linear MPC — classic control algorithms in pure NumPy, with benchmarks"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
dependencies = ["numpy", "scipy"]
keywords = ["control", "adrc", "pid", "mpc", "kalman-filter", "ukf", "self-tuning"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
dev = ["pytest", "matplotlib"]

[tool.setuptools.packages.find]
include = ["classic_controlling*"]
